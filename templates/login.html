{% extends 'base.html' %}
{% block title %}Connexion - Biwex{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">Bi<span>wex</span></div>
    <h2>Connexion</h2>
    <p class="subtitle">Accédez à votre espace client</p>
    <form method="post">
      <div class="form-group">
        <label><i class="bi bi-envelope"></i> Adresse email</label>
        <input type="email" name="email" placeholder="exemple@email.com" required>
      </div>
      <div class="form-group">
        <label><i class="bi bi-lock"></i> Mot de passe</label>
        <input type="password" name="password" placeholder="Votre mot de passe" required>
      </div>
      <button type="submit" class="btn-primary" style="margin-top:8px;">
        <i class="bi bi-box-arrow-in-right"></i> Se connecter
      </button>
    </form>
    <div class="auth-link">
      Pas encore de compte ? <a href="/register">Créer un compte</a>
    </div>
    <div
      style="margin-top:16px;padding:12px;background:#fff8f8;border-radius:6px;font-size:12px;color:#666;text-align:center;">
      <strong>Admin test :</strong> admin@biwex.tn / admin123
    </div>
  </div>
</div>
{% endblock %}
