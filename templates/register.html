{% extends 'base.html' %}
{% block title %}Inscription - Biwex{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">Bi<span>wex</span></div>
    <h2>Créer un compte</h2>
    <p class="subtitle">Rejoignez la communauté Biwex</p>
    <form method="post">
      <div class="form-group">
        <label><i class="bi bi-person"></i> Nom d'utilisateur</label>
        <input type="text" name="username" placeholder="Votre prénom et nom" required>
      </div>
      <div class="form-group">
        <label><i class="bi bi-envelope"></i> Adresse email</label>
        <input type="email" name="email" placeholder="exemple@email.com" required>
      </div>
      <div class="form-group">
        <label><i class="bi bi-lock"></i> Mot de passe</label>
        <input type="password" name="password" placeholder="Choisissez un mot de passe sécurisé" required>
      </div>
      <button type="submit" class="btn-primary" style="margin-top:8px;">
        <i class="bi bi-person-plus-fill"></i> Créer mon compte
      </button>
    </form>
    <div class="auth-link">
      Déjà un compte ? <a href="/login">Se connecter</a>
    </div>
  </div>
</div>
{% endblock %}
