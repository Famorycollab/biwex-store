<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="100%">
  <defs>
    <linearGradient id="watchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="screenWatch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
    <filter id="accShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="400" height="320" fill="#f8fafc" rx="12"/>
  
  <g transform="translate(130, 25)" filter="url(#accShadow)">
    <!-- Bracelet Montre Connectée -->
    <rect x="42" y="5" width="56" height="260" rx="14" fill="#334155"/>
    
    <!-- Boîtier Cadran Smartwatch -->
    <rect x="25" y="70" width="90" height="110" rx="28" fill="url(#watchGrad)" stroke="#64748b" stroke-width="2"/>
    <rect x="33" y="78" width="74" height="94" rx="22" fill="#000000"/>
    
    <!-- Écran Activité & Coeur -->
    <circle cx="70" cy="115" r="24" fill="none" stroke="#334155" stroke-width="5"/>
    <circle cx="70" cy="115" r="24" fill="none" stroke="url(#screenWatch)" stroke-width="5" stroke-dasharray="100,50" stroke-linecap="round"/>
    
    <!-- Fréquence Cardiaque -->
    <path d="M 52 118 L 62 118 L 66 108 L 72 126 L 78 114 L 82 118 L 88 118" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    
    <text x="70" y="152" font-family="-apple-system, system-ui, sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">138 BPM</text>

    <!-- Bouton Couronne Digitale -->
    <rect x="115" y="90" width="6" height="20" rx="3" fill="#cbd5e1"/>
  </g>
</svg>