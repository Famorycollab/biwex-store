<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="100%">
  <defs>
    <linearGradient id="laptopBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="laptopScreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="lapShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="400" height="320" fill="#f8fafc" rx="12"/>
  
  <g transform="translate(60, 45)" filter="url(#lapShadow)">
    <!-- Écran Laptop Ouvert -->
    <rect x="35" y="10" width="210" height="135" rx="10" fill="#0f172a"/>
    <rect x="40" y="15" width="200" height="125" rx="6" fill="url(#laptopScreen)"/>
    
    <!-- Code / Graphique sur écran -->
    <rect x="55" y="30" width="60" height="6" rx="3" fill="#ffffff" opacity="0.8"/>
    <rect x="55" y="44" width="95" height="5" rx="2.5" fill="#ffffff" opacity="0.6"/>
    <rect x="55" y="55" width="80" height="5" rx="2.5" fill="#ffffff" opacity="0.6"/>
    <circle cx="140" cy="85" r="24" fill="#ffffff" opacity="0.15"/>
    <path d="M 125 90 L 135 75 L 148 83 L 158 68" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>

    <!-- Caméra & Notch -->
    <circle cx="140" cy="13" r="2" fill="#64748b"/>
    
    <!-- Base Clavier -->
    <path d="M 10 145 L 270 145 L 285 205 L -5 205 Z" fill="url(#laptopBody)"/>
    
    <!-- Clavier & Touchpad -->
    <rect x="35" y="152" width="210" height="28" rx="4" fill="#0f172a" opacity="0.85"/>
    <rect x="110" y="184" width="60" height="16" rx="3" fill="#94a3b8" stroke="#64748b" stroke-width="1"/>
  </g>
</svg>