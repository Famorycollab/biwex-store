<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="100%">
  <defs>
    <linearGradient id="tvScreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0891b2"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="tvShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="400" height="320" fill="#f8fafc" rx="12"/>
  
  <g transform="translate(60, 40)" filter="url(#tvShadow)">
    <!-- Cadre TV Ultra-Fin -->
    <rect x="0" y="0" width="280" height="175" rx="6" fill="#0f172a"/>
    <rect x="4" y="4" width="272" height="167" rx="3" fill="url(#tvScreen)"/>
    
    <!-- Image Cinéma 4K HDR -->
    <circle cx="140" cy="85" r="40" fill="#ffffff" opacity="0.15"/>
    <polygon points="130,70 160,85 130,100" fill="#ffffff" opacity="0.9"/>
    
    <!-- Pied / Stand TV -->
    <polygon points="120,175 160,175 165,210 115,210" fill="#475569"/>
    <rect x="90" y="210" width="100" height="8" rx="4" fill="#1e293b"/>
  </g>
</svg>