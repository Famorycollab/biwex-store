<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="100%">
  <defs>
    <linearGradient id="headband" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="earcup" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="audioShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="400" height="320" fill="#f8fafc" rx="12"/>
  
  <g transform="translate(100, 30)" filter="url(#audioShadow)">
    <!-- Arceau Audio -->
    <path d="M 35 150 A 75 85 0 0 1 165 150" fill="none" stroke="url(#headband)" stroke-width="18" stroke-linecap="round"/>
    <path d="M 45 130 A 65 75 0 0 1 155 130" fill="none" stroke="#94a3b8" stroke-width="6" opacity="0.4"/>
    
    <!-- Oreillette Gauche -->
    <rect x="18" y="140" width="36" height="74" rx="18" fill="url(#earcup)"/>
    <rect x="36" y="148" width="12" height="58" rx="6" fill="#1e293b"/>
    <circle cx="36" cy="177" r="10" fill="#ffffff" opacity="0.2"/>
    
    <!-- Oreillette Droite -->
    <rect x="146" y="140" width="36" height="74" rx="18" fill="url(#earcup)"/>
    <rect x="152" y="148" width="12" height="58" rx="6" fill="#1e293b"/>
    <circle cx="164" cy="177" r="10" fill="#ffffff" opacity="0.2"/>
    
    <!-- Ondes Sonores Stylisées -->
    <path d="M -5 177 Q -15 160 -5 145" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
    <path d="M -15 185 Q -30 160 -15 135" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
    <path d="M 205 177 Q 215 160 205 145" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
    <path d="M 215 185 Q 230 160 215 135" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
  </g>
</svg>