<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="100%">
  <defs>
    <linearGradient id="padGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="rgbGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="gameShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#7c3aed" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="400" height="320" fill="#f8fafc" rx="12"/>
  
  <g transform="translate(80, 50)" filter="url(#gameShadow)">
    <!-- Manette Next-Gen Design -->
    <path d="M 40 90 C 20 140 10 180 35 200 C 60 215 90 170 120 170 C 150 170 180 215 205 200 C 230 180 220 140 200 90 C 180 40 60 40 40 90 Z" fill="url(#padGrad)"/>
    
    <!-- Bandeau LED RGB -->
    <path d="M 75 75 Q 120 85 165 75" fill="none" stroke="url(#rgbGlow)" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Croix Directionnelle (D-Pad) -->
    <g transform="translate(65, 105)">
      <rect x="0" y="8" width="24" height="8" rx="2" fill="#475569"/>
      <rect x="8" y="0" width="8" height="24" rx="2" fill="#475569"/>
      <circle cx="12" cy="12" r="3" fill="#64748b"/>
    </g>
    
    <!-- Boutons d'Action (X, Y, A, B) -->
    <g transform="translate(160, 105)">
      <circle cx="12" cy="4" r="4.5" fill="#ec4899"/>
      <circle cx="20" cy="12" r="4.5" fill="#06b6d4"/>
      <circle cx="12" cy="20" r="4.5" fill="#10b981"/>
      <circle cx="4" cy="12" r="4.5" fill="#f59e0b"/>
    </g>
    
    <!-- Joysticks Analogiques -->
    <circle cx="95" cy="140" r="15" fill="#0f172a" stroke="#475569" stroke-width="2"/>
    <circle cx="95" cy="140" r="8" fill="#334155"/>
    <circle cx="145" cy="140" r="15" fill="#0f172a" stroke="#475569" stroke-width="2"/>
    <circle cx="145" cy="140" r="8" fill="#334155"/>
  </g>
</svg>