<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="100%">
  <defs>
    <linearGradient id="phoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="titanium" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="400" height="320" fill="#f8fafc" rx="12"/>
  
  <!-- Smartphone 3D Perspective -->
  <g transform="translate(130, 25)" filter="url(#glow)">
    <!-- Chassis Titane -->
    <rect x="0" y="0" width="140" height="270" rx="28" fill="url(#titanium)"/>
    <rect x="3" y="3" width="134" height="264" rx="26" fill="url(#phoneGrad)"/>
    
    <!-- Écran Borderless AMOLED -->
    <rect x="7" y="7" width="126" height="256" rx="22" fill="url(#screenGrad)"/>
    
    <!-- Dynamic Island / Poinçon -->
    <rect x="48" y="14" width="44" height="12" rx="6" fill="#000000"/>
    <circle cx="78" cy="20" r="3" fill="#1e293b"/>
    
    <!-- Reflet d'écran -->
    <path d="M 10 10 L 130 10 L 40 250 L 10 250 Z" fill="#ffffff" opacity="0.12"/>
    
    <!-- Horloge / Widgets sur l'écran -->
    <text x="70" y="75" font-family="-apple-system, system-ui, sans-serif" font-size="28" font-weight="800" fill="#ffffff" text-anchor="middle">10:45</text>
    <text x="70" y="95" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="600" fill="#ffffff" opacity="0.9" text-anchor="middle">Biwex 5G • 100%</text>
    
    <!-- Icône App en bas -->
    <circle cx="70" cy="235" r="14" fill="#ffffff" opacity="0.25"/>
    <path d="M 64 235 L 76 235" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>