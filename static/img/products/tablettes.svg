<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="100%">
  <defs>
    <linearGradient id="tabGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="tabShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="400" height="320" fill="#f8fafc" rx="12"/>
  
  <g transform="translate(105, 30)" filter="url(#tabShadow)">
    <!-- Chassis Tablette Métallique -->
    <rect x="0" y="0" width="180" height="250" rx="18" fill="#334155"/>
    <rect x="3" y="3" width="174" height="244" rx="15" fill="#0f172a"/>
    <rect x="8" y="8" width="164" height="234" rx="12" fill="url(#tabGrad)"/>
    
    <!-- Écran Créatif Liquid Retina -->
    <circle cx="90" cy="115" r="45" fill="#ffffff" opacity="0.18"/>
    <path d="M 50 145 C 75 100 105 130 130 90" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <circle cx="130" cy="90" r="5" fill="#fef08a"/>

    <!-- Stylus / Stylet Magnétique Attaché -->
    <g transform="translate(186, 40)">
      <rect x="0" y="0" width="8" height="170" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <polygon points="0,0 8,0 4,-12" fill="#e2e8f0"/>
      <rect x="2" y="30" width="4" height="15" rx="2" fill="#94a3b8"/>
    </g>
  </g>
</svg>